name: Herb Updates On Watch & Follow Tick (manual)

# No schedule — ticks only when someone clicks "Check now" on the dashboard,
# or via workflow_dispatch for manual testing from the Actions tab. Renamed
# 2026-08-27 from herb-radar.yml / "Update Radar" (see
# supabase/migrations/20260827_herb_watch_follow_rename.sql for why).
on:
  workflow_dispatch: {}   # manual trigger for testing
  repository_dispatch:
    types: [run-watch-follow-tick]   # dashboard's "Check now" button

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_PAT:                    ${{ secrets.GH_PAT }}
      PIPEDRIVE_TOKEN:           ${{ secrets.PIPEDRIVE_TOKEN }}
      PIPEDRIVE_DOMAIN:          icoscapital

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -q -r requirements.txt

      - name: Check automatically-selected deals for updates
        run: python -m scripts.watch_follow_tick
