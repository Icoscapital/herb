name: Herb Update Radar Tick (manual)

# No schedule — the bi-weekly cron was removed 2026-08-20. Radar now only
# ticks when someone clicks "Check now" on the dashboard, or via
# workflow_dispatch for manual testing from the Actions tab.
on:
  workflow_dispatch: {}   # manual trigger for testing
  repository_dispatch:
    types: [run-radar-tick]   # dashboard's "Check now" button

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_PAT:                    ${{ secrets.GH_PAT }}
      PIPEDRIVE_TOKEN:           ${{ secrets.PIPEDRIVE_TOKEN }}
      PIPEDRIVE_DOMAIN:          icoscapital

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -q -r requirements.txt

      - name: Check curated deals for updates
        run: python -m scripts.radar_tick
