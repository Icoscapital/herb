name: Run Updates On Watch & Follow (on-demand)

# Renamed 2026-08-27 from run-update-radar.yml / "Update Radar" (see
# supabase/migrations/20260827_herb_watch_follow_rename.sql for why).
on:
  repository_dispatch:
    types: [run-watch-follow]

# Prevent two concurrent workflows for the same run_id.
concurrency:
  group: herb-watch-follow-${{ github.event.client_payload.run_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      # HERB_RADAR_ANTHROPIC_API_KEY is a leftover secret name from before
      # the rename — it's just an opaque GitHub secret name pointing at the
      # same Anthropic API key, and secrets can't be renamed from a repo
      # checkout, so it's left as-is deliberately (nothing to change here).
      ANTHROPIC_API_KEY:         ${{ secrets.HERB_RADAR_ANTHROPIC_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SB_URL:                    ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SB_KEY:                    ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WATCH_FOLLOW_RUN_ID:       ${{ github.event.client_payload.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -q -r requirements.txt

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Updates On Watch & Follow research
        run: |
          # WATCH_FOLLOW_RUN_ID is exported as an env var above. The prompt's
          # STEP 1 reads it via start_watch_follow_run() and processes the
          # automatically-selected batch.
          claude -p "$(cat watch_follow_prompt.md)" \
            --allowedTools Bash,Read,Write,Task,WebSearch,WebFetch \
            --model claude-sonnet-5 \
            --max-turns 150

      - name: Verify run reached terminal state
        if: always()
        run: |
          # Belt-and-suspenders: even if Claude returned 0, fail the job if the
          # row isn't DONE. Catches "Claude exited silently without finalizing".
          python - <<'PY'
          import os, sys
          from supabase import create_client
          sb = create_client(os.environ["NEXT_PUBLIC_SUPABASE_URL"],
                             os.environ["SUPABASE_SERVICE_ROLE_KEY"])
          r = sb.table("herb_watch_follow_runs").select("status,error_message,progress").eq("id", os.environ["WATCH_FOLLOW_RUN_ID"]).single().execute()
          status = r.data.get("status")
          if status == "DONE":
              print(f"[verify] run completed successfully: status={status}")
              sys.exit(0)
          if status == "ERROR":
              print(f"[verify] run errored: {r.data.get('error_message')}")
              sys.exit(1)
          msg = f"Worker exited without finalizing (status={status}, progress={r.data.get('progress')})"
          print(f"[verify] {msg}")
          sb.table("herb_watch_follow_runs").update({
              "status": "ERROR",
              "error_message": msg[:500],
              "progress": "Failed: worker exited mid-run",
          }).eq("id", os.environ["WATCH_FOLLOW_RUN_ID"]).execute()
          sys.exit(1)
          PY
