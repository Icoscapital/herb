name: Herb Universe Freshness (monthly)

# Emails a PitchBook-refresh request when references/vc-universe.xlsx is
# older than ~6 months. Keyed off the file's last commit date, so committing
# a refreshed export silences it automatically.

on:
  schedule:
    - cron: '0 7 2 * *'    # 2nd of every month, 07:00 UTC
  workflow_dispatch: {}     # manual trigger for testing

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GRAPH_TENANT_ID:     ${{ secrets.GRAPH_TENANT_ID }}
      GRAPH_CLIENT_ID:     ${{ secrets.GRAPH_CLIENT_ID }}
      GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}

    steps:
      - name: Checkout (full history — needed for the file's commit date)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -q -r requirements.txt

      - name: Check universe age, email if stale
        run: python -m scripts.check_universe_freshness
